# Local / lab compose. Jenkins uses the Jenkinsfile + Docker run directly.
# Ports match docs/domains.md: FE 6018, BE 6019. Postgres stays on the host by default.

services:
  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
    env_file:
      - backend/.env
    environment:
      # Override only if you also start the optional `db` service below.
      # POSTGRES_HOST: db
      # POSTGRES_PORT: 5432
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6019:8000"
    volumes:
      - media_data:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:6019}
    ports:
      - "6018:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional local Postgres if you do not already have one on the host.
  # Uncomment and set POSTGRES_HOST=db in backend/.env when using this.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB:-vix_kanban}
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data

volumes:
  media_data:
  # postgres_data:
