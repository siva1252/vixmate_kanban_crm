upstream viximate_backend {
    server 127.0.0.1:6019;
}

upstream viximate_frontend {
    server 127.0.0.1:6018;
}

# API — leads-api.internal.viximate.com → host port 6019
server {
    listen 80;
    server_name leads-api.internal.viximate.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://viximate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}

# App — leads.internal.viximate.com (+ www) → host port 6018
server {
    listen 80;
    server_name leads.internal.viximate.com www.leads.internal.viximate.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://viximate_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
